<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica IDW S.A - Reservar Turno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <input type="checkbox" id="dark-toggle" style="display: none;">
    <div id="page-wrapper">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <div class="switch-wrapper" style="position: fixed; top: 10px; right: 10px; z-index: 1000;">
            <label for="dark-toggle" class="dark-switch">
                <span class="knob"></span>
            </label>
        </div>

        <header class="mt-3 mx-3">
            <h1>Clínica IDW S.A<i class="bi bi-stethoscope"></i></h1>
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav mb-2 mb-lg-0 mx-auto">
                            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="institucional.html">Institucional</a></li>
                            <li class="nav-item"><a class="nav-link" href="medicos.html">Medicos Especialistas</a></li>
                            <li class="nav-item" id="navAltaMedico" style="display: none;"><a class="nav-link" href="altaMedicos.html">Alta Medico</a></li>
                            <li class="nav-item" id="navAdminMedico" style="display: none;"><a class="nav-link" href="admin_users.html">Admin Medico</a></li>
                            <li class="nav-item" id="navAdminOS" style="display: none;"><a class="nav-link" href="altaobsociales.html">Admin Obras Sociales</a></li>
                            <li class="nav-item" id="navAdminEsp" style="display: none;"><a class="nav-link" href="altaoespecialidadea.html">Admin Especialidades </a></li>
                            <li class="nav-item" id="navAdminReservas" style="display: none;"><a class="nav-link" href="admin_resevas.html">Admin Reservas</a></li>
                            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                        </ul>
                        <ul class="navbar-nav mb-2 mb-lg-0 ms-auto">
                            <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body p-4">
                            <h2 class="card-title text-center mb-4" id="nombreMedicoReserva">Reservar turno con...</h2>
                            
                            <form id="formReserva">
                                <div class="mb-3">
                                    <label for="nombrePaciente" class="form-label">Tu Nombre Completo</label>
                                    <input type="text" class="form-control" id="nombrePaciente" required>
                                </div>
                                <div class="mb-3">
                                    <label for="emailPaciente" class="form-label">Tu Email</label>
                                    <input type="email" class="form-control" id="emailPaciente" required>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="fechaTurno" class="form-label">Fecha</label>
                                        <input type="date" class="form-control" id="fechaTurno" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="horaTurno" class="form-label">Horario</label>
                                        <select class="form-select" id="horaTurno" required>
                                            <option value="" selected disabled>Elegir un horario...</option>
                                            <option value="08:00">08:00 hs</option>
                                            <option value="08:30">08:30 hs</option>
                                            <option value="09:00">09:00 hs</option>
                                            <option value="09:30">09:30 hs</option>
                                            <option value="10:00">10:00 hs</option>
                                            <option value="10:30">10:30 hs</option>
                                            <option value="11:00">11:00 hs</option>
                                            <option value="11:30">11:30 hs</option>
                                            <option value="12:00">12:00 hs</option>
                                            <option value="12:30">12:30 hs</option>
                                            <option value="13:00">13:00 hs</option>
                                            <option value="13:30">13:30 hs</option>
                                            <option value="14:00">14:00 hs</option>
                                            <option value="14:30">14:30 hs</option>
                                            <option value="15:00">15:00 hs</option>
                                            <option value="15:30">15:30 hs</option>
                                            <option value="16:00">16:00 hs</option>
                                            <option value="16:30">16:30 hs</option>
                                            <option value="17:00">17:00 hs</option>
                                            <option value="17:30">17:30 hs</option>
                                            <option value="18:00">18:00 hs</option>
                                            <option value="18:30">18:30 hs</option>
                                            <option value="19:00">19:00 hs</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-success w-100">Confirmar Reserva</button>
                            </form>
                            
                            <div id="mensajeReserva" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="bg-dark text-center text-white py-4 mb-3 mx-3 ">
            <p class="mb-3">© 2025 Clínica IDW S.A | Grupo 63</p>
            </footer>
    </div>
    
    <script src="js/reserva.js"></script> 

    <script src="js/navoculto.js"></script>

    <script>
        // Lógica del dark mode
        const toggle = document.getElementById('dark-toggle');
        toggle.checked = localStorage.getItem('darkMode') === 'true';

        toggle.addEventListener('change', () => {
            localStorage.setItem('darkMode', toggle.checked);
        });
    </script>
</body>
</html>
